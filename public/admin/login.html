<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar - Admin</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="card">
        <h2>Panel de administración</h2>
        <p class="muted">Inicia sesión para gestionar grados y alumnos</p>
        <form id="login-form">
          <div style="margin-bottom: 12px;">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" autocomplete="username" required />
          </div>
          <div style="margin-bottom: 16px;">
            <label for="password">Contraseña</label>
            <input type="password" id="password" autocomplete="current-password" required />
          </div>
          <div id="error" class="error" style="display:none;"></div>
          <button type="submit" style="width:100%;">Ingresar</button>
        </form>
        <p style="margin-top: 16px;"><a class="link" href="/">&larr; Volver al inicio</a></p>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
